<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title>How the viewer draws the robot from /xform_world</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5ad1ff"/>
    </marker>
    <style>
      .box { fill: #121b2e; stroke: #2a3550; stroke-width: 1.5; }
      .hot { stroke: #5ad1ff; }
      .t { fill: #e9eef7; font-size: 15px; font-weight: 700; }
      .s { fill: #8592a8; font-size: 12.5px; }
      .c { fill: #5ad1ff; font-size: 12.5px; }
      .o { fill: #ff9a3c; }
      .wire { stroke: #5ad1ff; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .lbl { fill: #5ad1ff; font-size: 11px; }
      .cell { font-size: 14px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="470" rx="14" fill="#0a0f1a"/>

  <!-- ===== top: the pipeline ===== -->
  <g transform="translate(24,26)">
    <rect class="box" width="190" height="112" rx="10"/>
    <text class="t" x="14" y="28">my runtime</text>
    <text class="c" x="14" y="50">make demo</text>
    <text class="s" x="14" y="72">FSM → servo → FK</text>
    <text class="s" x="14" y="92">publishes 10 Hz</text>
  </g>
  <path class="wire" d="M216,82 H266"/>
  <text class="lbl" x="241" y="72" text-anchor="middle">TCP</text>

  <g transform="translate(270,26)">
    <rect class="box" width="190" height="112" rx="10"/>
    <text class="t" x="14" y="28">record_frames.py</text>
    <text class="c" x="14" y="50">/xform_world</text>
    <text class="s" x="14" y="72">a client, just like</text>
    <text class="s" x="14" y="92">the autograder</text>
  </g>
  <path class="wire" d="M462,82 H512"/>
  <text class="lbl" x="487" y="72" text-anchor="middle">JSON</text>

  <g transform="translate(516,26)">
    <rect class="box hot" width="190" height="112" rx="10"/>
    <text class="t" x="14" y="28">viewer.html</text>
    <text class="c" x="14" y="50">three.js + WebGL</text>
    <text class="s" x="14" y="72">+ fetch.urdf visuals</text>
    <text class="s" x="14" y="92">+ fetch.glb meshes</text>
  </g>
  <path class="wire" d="M708,82 H758"/>

  <g transform="translate(762,26)">
    <rect class="box" width="174" height="112" rx="10"/>
    <text class="t" x="14" y="28">on this page</text>
    <text class="c" x="14" y="50">interactive replay</text>
    <text class="s" x="14" y="72">teaser: headless</text>
    <text class="s" x="14" y="92">Chrome → ffmpeg</text>
  </g>

  <line x1="24" y1="168" x2="936" y2="168" stroke="#2a3550" stroke-dasharray="4 6"/>

  <!-- ===== bottom left: one /xform_world entry ===== -->
  <text class="s" x="24" y="200">one entry of /xform_world</text>
  <g transform="translate(24,214)">
    <rect class="box" width="292" height="128" rx="10"/>
    <text class="s" x="14" y="28">{</text>
    <text class="s" x="28" y="50">"child_frame_id":</text>
    <text class="c" x="44" y="70">"gripper_link",</text>
    <text class="s" x="28" y="92">"matrix": [m0, m1, …, m15]</text>
    <text class="s" x="14" y="114">}</text>
  </g>
  <path class="wire" d="M322,283 H372"/>
  <text class="lbl" x="347" y="273" text-anchor="middle">fromArray</text>

  <!-- ===== bottom middle: the column-major layout ===== -->
  <text class="s" x="380" y="200">column-major: m[4·col + row]</text>
  <g transform="translate(380,214)">
    <rect x="0" y="0" width="168" height="102" rx="6" fill="#5ad1ff" fill-opacity="0.10" stroke="#5ad1ff" stroke-opacity="0.5"/>
    <rect x="172" y="0" width="56" height="102" rx="6" fill="#ff9a3c" fill-opacity="0.12" stroke="#ff9a3c" stroke-opacity="0.6"/>
    <g class="cell" fill="#e9eef7">
      <text x="28" y="26">m0</text><text x="84" y="26">m4</text><text x="140" y="26">m8</text>
      <text x="28" y="58">m1</text><text x="84" y="58">m5</text><text x="140" y="58">m9</text>
      <text x="28" y="90">m2</text><text x="84" y="90">m6</text><text x="140" y="90">m10</text>
      <text class="o" x="200" y="26">m12</text><text class="o" x="200" y="58">m13</text><text class="o" x="200" y="90">m14</text>
    </g>
    <g class="cell" fill="#5d6a80">
      <text x="28" y="126">0</text><text x="84" y="126">0</text><text x="140" y="126">0</text><text x="200" y="126">1</text>
    </g>
    <text class="c" x="84" y="160" text-anchor="middle">rotation R</text>
    <text x="200" y="160" text-anchor="middle" font-size="12.5" fill="#ff9a3c">position</text>
  </g>

  <!-- ===== bottom right: how a part is placed ===== -->
  <g transform="translate(636,190)">
    <text class="t" x="0" y="10">placing one part</text>
    <text class="s" x="0" y="40">mesh pose =</text>
    <text x="0" y="62" font-size="13.5" fill="#e9eef7">X_world(link) · T(<tspan fill="#5ad1ff">&lt;visual&gt;&lt;origin&gt;</tspan>)</text>
    <text class="s" x="0" y="100">same order as the runtime,</text>
    <text class="s" x="0" y="120">so no transpose is needed</text>
    <text class="t" x="0" y="160">smooth motion</text>
    <text class="s" x="0" y="186">10 Hz samples → 60 fps:</text>
    <text class="s" x="0" y="206">lerp position, slerp rotation</text>
  </g>

  <text class="s" x="24" y="448" font-size="11.5">Python records; JavaScript only draws. The browser never computes kinematics.</text>
</svg>
